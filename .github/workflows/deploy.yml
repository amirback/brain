name: Deploy to GitHub Pages

# Зеркало на GitHub Pages больше не собирается автоматически.
# Оно клало готовую статику в ветку gh-pages, а Vercel по умолчанию делает
# превью-деплой для каждой ветки — заходил туда, не находил package.json и
# падал с «failed preview deployment» на каждый пуш в main.
# Основной адрес — brainstudy.online на Vercel. Зеркало осталось как запасной
# вариант и запускается вручную из вкладки Actions.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages can only serve pre-built files, and a POST route handler
      # cannot be statically exported. The app detects the missing endpoint and
      # falls back to its rule-based mentor, so the exported site still works —
      # it just doesn't have the language model behind the chat. The full
      # version runs on Vercel.
      - name: Drop the server-only API routes
        run: rm -rf src/app/api

      - name: Build static site
        env:
          # GitHub Pages serves this project from /brain
          NEXT_PUBLIC_BASE_PATH: /brain
          STATIC_EXPORT: "1"
        run: npm run build

      - name: Publish to the gh-pages branch
        run: |
          touch out/.nojekyll
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
