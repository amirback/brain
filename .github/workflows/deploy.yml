name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Turns Pages on for the repo the first time this runs, so no manual
      # switch-flipping in Settings is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Build static site
        env:
          # GitHub Pages serves this project from /brain
          NEXT_PUBLIC_BASE_PATH: /brain
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
